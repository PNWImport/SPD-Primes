[package]
name = "quanjp-prime-hunter-ultimate"
version = "2050.3.0"
edition = "2021"

[dependencies]
rand = "0.8"
rayon = "1.8"
num-bigint = { version = "0.4", features = ["rand"] }
num-traits = "0.2"
num_cpus = "1.16"
indicatif = "0.17"
chrono = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lazy_static = "1.4"
colored = "2.1"
sha3 = "0.10"

[[bin]]
name = "quanjp-prime-hunter"
path = "src/main.rs"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
